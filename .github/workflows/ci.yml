name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @arqen/browser exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: CLI smoke verification
        shell: bash
        run: |
          set -euo pipefail
          node apps/cli/dist/index.js --help
          node apps/cli/dist/index.js --version
          node apps/cli/dist/index.js analyze fixtures/movie-site-fixture --json > /tmp/arqen-analyze.json
          node apps/cli/dist/index.js audit fixtures/movie-site-fixture --json > /tmp/arqen-audit.json
          node apps/cli/dist/index.js review . --json > /tmp/arqen-review.json
          node apps/cli/dist/index.js diff fixtures/movie-site-fixture --json > /tmp/arqen-diff.json
          node apps/cli/dist/index.js fix fixtures/movie-site-fixture --json > /tmp/arqen-fix.json
          node apps/cli/dist/index.js validate fixtures/movie-site-fixture --json > /tmp/arqen-validate.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/orchestrator/requirements.txt
      - run: python -m pytest services/orchestrator -q
