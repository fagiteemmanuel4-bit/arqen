name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @arqen/browser exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/orchestrator/requirements.txt
      - run: python -m pytest services/orchestrator -q
