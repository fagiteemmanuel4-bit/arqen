name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      # GitHub-hosted runners provide a current Node 22+ runtime, which satisfies
      # the repository engine requirement (>=22.12.0). Generate a lockfile for
      # this clean-room run, then make the actual install frozen.
      - run: node --version
      - run: pnpm --version
      - run: pnpm install --lockfile-only
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arqen/browser exec playwright install --with-deps chromium
      # Build first so workspace package exports have their generated .d.ts
      # files available to the root TypeScript project-reference check.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/orchestrator/requirements.txt
      - run: python -m pytest services/orchestrator -q
